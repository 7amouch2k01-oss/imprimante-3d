[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node scripts/prepare-db.js && npx prisma db push --accept-data-loss && npx ts-node prisma/seed.ts && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.healthcheck]
path = "/api/health"
timeout = 100
interval = 30
