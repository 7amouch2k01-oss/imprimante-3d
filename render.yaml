services:
  - type: web
    name: printer-ecommerce-platform
    env: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: printer-ecommerce-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  - name: printer-ecommerce-db
    databaseName: printer_db
    user: printer_user
    plan: starter
